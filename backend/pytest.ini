[pytest]
# Pytest configuration for backend tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Coverage options (updated for app/ directory)
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=json
    # Fail if coverage is below 80%
    --cov-fail-under=80
    # Disable coverage for test files
    --cov-config=.coveragerc
    # Strict markers
    --strict-markers
    # Show warnings
    -W default

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires external services)
    api: API endpoint tests
    sheets: Google Sheets integration tests
    auth: Authentication tests
    jobs: Job queue tests
    agents: LLM agent tests
    metrics: Metrics and monitoring tests
    slow: Slow running tests

# Ignore directories
norecursedirs = .git .tox dist build *.egg __pycache__ api services

# Log output
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (optional, requires pytest-timeout)
# timeout = 300

# Parallel execution (requires pytest-xdist)
# Use: pytest -n auto
