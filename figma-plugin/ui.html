<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Template Automation</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 16px;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      font-weight: 600;
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 12px;
      font-weight: 500;
      color: #666;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    textarea {
      min-height: 100px;
      font-family: monospace;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button.primary {
      background-color: #0066ff;
      color: white;
    }
    button.primary:hover {
      background-color: #0052cc;
    }
    button.secondary {
      background-color: #f0f0f0;
      color: #333;
    }
    button.secondary:hover {
      background-color: #e0e0e0;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .status.success {
      background-color: #e7f5e7;
      color: #2d7a2d;
    }
    .status.error {
      background-color: #ffe7e7;
      color: #c42929;
    }
  </style>
</head>
<body>
  <h2>📝 Template Automation</h2>

  <button class="secondary" id="getInfo">📊 テンプレート情報を取得</button>

  <div id="templateInfo" style="display: none; margin-top: 12px; padding: 12px; background: #f8f8f8; border-radius: 4px;">
    <h3 style="margin: 0 0 8px 0; font-size: 14px;">テンプレート情報</h3>
    <pre id="infoDisplay" style="font-size: 11px; overflow: auto; max-height: 200px;"></pre>
  </div>

  <label for="jobId">Job ID:</label>
  <input type="text" id="jobId" placeholder="job_123" />

  <label for="fields">Fields (JSON):</label>
  <textarea id="fields" placeholder='{"HEAD_TITLE": "新商品発売キャンペーン", "SUB_TITLE": "今だけ50%OFF"}'></textarea>

  <label for="colors">Colors (JSON):</label>
  <textarea id="colors" placeholder='{"HEAD_TITLE": {"fill": "#FF6B6B", "stroke": "#000000", "stroke_width_px": 2}}'></textarea>

  <button class="primary" id="apply">✨ テンプレート適用</button>
  <button class="secondary" id="export">📥 書き出し (PNG)</button>
  <button class="secondary" id="cancel">❌ キャンセル</button>

  <div id="status"></div>

  <script>
    document.getElementById('getInfo').onclick = () => {
      parent.postMessage({
        pluginMessage: { type: 'get-template-info' }
      }, '*');
      showStatus('テンプレート情報を取得中...', false);
    };

    document.getElementById('apply').onclick = () => {
      const jobId = document.getElementById('jobId').value;
      const fieldsText = document.getElementById('fields').value;
      const colorsText = document.getElementById('colors').value;

      try {
        const fields = fieldsText ? JSON.parse(fieldsText) : null;
        const colors = colorsText ? JSON.parse(colorsText) : null;

        parent.postMessage({
          pluginMessage: {
            type: 'apply-template',
            jobId,
            fields,
            colors
          }
        }, '*');

        showStatus('Applying template...', false);
      } catch (error) {
        showStatus('Invalid JSON: ' + error.message, true);
      }
    };

    document.getElementById('export').onclick = () => {
      parent.postMessage({
        pluginMessage: {
          type: 'export-template',
          format: 'png',
          scale: 2
        }
      }, '*');
      showStatus('Exporting...', false);
    };

    document.getElementById('cancel').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    };

    function showStatus(message, isError) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status ' + (isError ? 'error' : 'success');
    }

    onmessage = (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'template-info') {
        const info = msg.data;

        if (info.error) {
          showStatus(info.error, true);
          return;
        }

        // Display template info
        document.getElementById('templateInfo').style.display = 'block';
        document.getElementById('infoDisplay').textContent = JSON.stringify(info, null, 2);

        showStatus(`テンプレート情報取得成功: ${info.textNodes.length}個のテキストレイヤーを検出`, false);

      } else if (msg.type === 'apply-success') {
        showStatus('✅ テンプレート適用成功！', false);

      } else if (msg.type === 'apply-error') {
        showStatus('❌ エラー: ' + msg.error, true);

      } else if (msg.type === 'export-success') {
        showStatus('✅ 書き出し成功！', false);

      } else if (msg.type === 'export-error') {
        showStatus('❌ 書き出しエラー: ' + msg.error, true);
      }
    };
  </script>
</body>
</html>
